[workspace]
name = "pixi-star-history"
version = "0.1.0"
description = "Track and forecast GitHub star history for Pixi and related package managers"
authors = ["Bas Zalmstra"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.12,<3.14"
numpy = ">=2.0"
plotly = ">=6.0"
requests = ">=2.32"

[pypi-dependencies]
pixi-star-history = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8.3"
ruff = ">=0.11"

[environments]
default = { features = ["dev"], solve-group = "default" }

[tasks]
collect = "python -m star_history collect"
build-site = "python -m star_history build-site"
refresh = { cmd = "python -m star_history build-site", depends-on = ["collect"] }
format = "ruff format src tests"
lint = "ruff check src tests"
test = "pytest"
check = { depends-on = ["lint", "test"] }
