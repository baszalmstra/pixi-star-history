[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixi-star-history"
version = "0.1.0"
description = "Track and forecast GitHub star history for Pixi and related package managers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Bas Zalmstra" }]

[tool.hatch.build.targets.wheel]
packages = ["src/star_history"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/star_history/site.py" = ["E501"]
